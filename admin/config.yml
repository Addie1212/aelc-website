backend:
  name: git-gateway
  repo: Addie1212/aelc-website
  branch: main
  identity_url: https://auth.decapbridge.com/sites/9ed13b03-e280-42bc-a96a-031bf0176f90
  gateway_url: https://gateway.decapbridge.com

# Connects to your existing repository folder
media_folder: "photos"
public_folder: "/photos"

collections:
  - name: "site_pages"
    label: "Website Pages"
    delete: false # Prevents accidental deletion of your core files
    files:
      - name: "index"
        label: "Main Home Page (index.html)"
